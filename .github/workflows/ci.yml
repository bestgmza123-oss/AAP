name: AAP UI CI

on:
  # Topic branches are verified by pull_request; avoid running an identical push job.
  # Do not path-filter these required checks, or unrelated PR changes can leave them pending.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aap-ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: AAP UI quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AAP_UI_P1
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@v4

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AAP_UI_P1/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Static scope audit
        run: npm run audit:scope

      - name: Production build
        run: npm run build

  browser:
    name: Playwright browser smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AAP_UI_P1
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@v4

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AAP_UI_P1/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            AAP_UI_P1/playwright-report/
            AAP_UI_P1/test-results/
          if-no-files-found: warn
          retention-days: 14
